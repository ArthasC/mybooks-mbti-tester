<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5efe4">
  <title>从藏书看 MBTI</title>
  <link rel="stylesheet" href="lib/app.css">
</head>
<body>
  <main class="oracle" id="app">
    <header class="masthead">
      <span class="brand-mark" aria-hidden="true">✳</span>
      <span>书库人格研究所</span>
      <span class="edition">第 01 号 · 非正规测验</span>
    </header>

    <section class="intro panel" id="intro">
      <div class="eyebrow">把你读过的书，翻译成一种人格</div>
      <h1>你的书库，<br><em>藏着哪种人格？</em></h1>
      <p class="lede">分类和标签不会说谎——最多只是有一点点戏精。</p>
      <div class="intro-stamp" aria-hidden="true"><span>书</span><small>架<br>有<br>料</small></div>
      <div class="intro-bottom">
        <p>翻一翻你的藏书偏好，看看书库会给你贴上什么 MBTI 标签。</p>
        <button class="start-button" id="start-button">
          <span>开始书库占卜</span><span aria-hidden="true">↗</span>
        </button>
      </div>
      <div class="disclaimer">⚠ 纯属娱乐，不是心理测验；不会收集或上报任何数据。</div>
    </section>

    <section class="reading panel" id="reading" hidden aria-live="polite">
      <div class="reading-orbit" aria-hidden="true"><span>✳</span></div>
      <div class="eyebrow">正在翻阅你的藏书</div>
      <h2 id="reading-message">请稍候，书库正在回忆……</h2>
      <div class="progress-track"><span id="progress-bar"></span></div>
      <p>只读取书籍分类与标签，不会改动书库。</p>
    </section>

    <section class="result" id="result" hidden aria-live="polite"></section>
    <section class="error panel" id="error" hidden role="alert">
      <div class="eyebrow">占卜中断</div>
      <h2>书库暂时没有回应。</h2>
      <p id="error-message"></p>
      <button class="start-button retry-button" id="retry-button">再试一次 <span>↗</span></button>
    </section>
    <footer class="footer">本研究所不收集个人资料，也不对你的阅读品味作任何评价。</footer>
  </main>
  <script src="/static/toolbox-bridge.js"></script>
  <script src="app.js"></script>
</body>
</html>
